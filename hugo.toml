baseURL = "https://weizhewu.github.io/boke/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "Wei's Blog"
theme = "PaperMod"
pagination.pagerSize = 10
enableRobotsTXT = true
enableEmoji = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "后端工程师 · 技术笔记与思考"
  author = "Wei"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false
  disableSpecial1stPost = true
  showtoc = true

  [params.profileMode]
    enabled = true
    title = "Wei"
    subtitle = "Backend Engineer · 记录技术与生活"
    imageUrl = "avatar.svg"
    imageTitle = "avatar"
    buttons = [
      { name = "博客", url = "posts" },
      { name = "关于", url = "about" },
    ]

  [params.label]
    text = "Wei's Blog"
    icon = "avatar.svg"
    iconHeight = 35

  [params.cover]
    hiddenInList = true
    hiddenInSingle = true

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/weizhewu"

[[params.socialIcons]]
  name = "email"
  url = "mailto:weizhewu232623@gmail.com"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "博客"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 30

[markup.highlight]
  noClasses = false
